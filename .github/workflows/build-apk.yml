name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Instalar dependências do sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool \
          pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
          cmake libffi-dev libssl-dev build-essential ccache

    - name: Instalar JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Confirmar JAVA_HOME
      run: |
        echo "JAVA_HOME=$JAVA_HOME"
        java -version

    - name: Instalar Buildozer
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade Cython==0.29.36 virtualenv buildozer

    - name: Cache do Android SDK/NDK
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          ComunicaFacil/.buildozer
        key: buildozer-${{ hashFiles('ComunicaFacil/buildozer.spec') }}

    - name: Compilar APK
      working-directory: ComunicaFacil
      run: buildozer -v android debug

    - name: Guardar APK
      uses: actions/upload-artifact@v4
      with:
        name: ComunicaFacil-apk
        path: ComunicaFacil/bin/*.apk

